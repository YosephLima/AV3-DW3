# Banco em memória: a aplicação roda sem instalar nada e o seed recria os dados a cada inicialização
spring.datasource.url=jdbc:h2:mem:automanager
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.h2.console.enabled=true

# Para usar o MySQL da base original, comente o bloco acima e descomente este
#spring.datasource.url=jdbc:mysql://localhost:3306/base?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=root
#spring.jpa.hibernate.ddl-auto=create

# Inclui a mensagem da ResponseStatusException no corpo de erro padrão do Spring Boot
server.error.include-message=always
# O devtools liga o stack trace e a lista crua de erros de validação nas respostas de erro
server.error.include-stacktrace=never
server.error.include-binding-errors=never
